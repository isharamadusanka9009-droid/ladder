name: Build Windows Installer

on:
  workflow_dispatch:   # lets you click "Run workflow" manually
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish app
        working-directory: LadderToArduino/LadderToArduino
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        working-directory: LadderToArduino/LadderToArduino
        run: iscc setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LadderToArduino-Setup
          path: LadderToArduino/LadderToArduino/Output/LadderToArduino-Setup.exe
